[package]
name = "tagliacarte_core"
version = "0.1.0"
edition = "2021"
description = "Core backend for tagliacarte email client: Store/Folder/Message/Transport, protocols, local storage, MIME"

[dependencies]
bytes = "1.5"
chrono = "0.4"
percent-encoding = "2.3"
hmac = "0.12"
md5 = { package = "md-5", version = "0.10" }
pbkdf2 = "0.12"
sha2 = "0.10"
rcgen = "0.13"
sha1 = "0.10"
getrandom = "0.2"
chacha20poly1305 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
secp256k1 = { version = "0.29", features = ["global-context"] }
bech32 = "0.11"
base64 = "0.22"
aes = "0.8"
cbc = "0.1"
chacha20 = "0.9"
hkdf = "0.12"
rand = "0.8"
vodozemac = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctr = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
ed25519-dalek = "2"

# hopf networking framework: 0.5 carries everything the port needed.
hopf-core = "0.5"
hopf-dns = "0.5"
hopf-smtp = "0.5"
hopf-auth = "0.5"
hopf-pop3 = "0.5"
hopf-imap = "0.5"
hopf-http = "0.5"
hopf-websocket = "0.5"
tractrix = "0.2.3"
rjsonparser = "0.2"
rmimeparser = "0.5"
hopf-nntp = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
[dev-dependencies]
hopf-webdav = "0.5"
# In-process hopf servers for the protocol tests under tests/.
hopf-mailbox = "0.5"
tempfile = "3"
