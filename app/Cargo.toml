[package]
name = "tagliacarte_app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tagliacarte_core = { path = "../core" }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync", "macros", "net", "io-util", "fs"] }
tokio-rustls = "0.26"
flutter_rust_bridge = "=2.12.0"
once_cell = "1.21.3"
base64 = "0.22"
url = "2.5"
percent-encoding = "2.3"
getrandom = "0.2"
serde = { version = "1.0", features = ["derive"] }
webbrowser = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.9", features = ["tls"] }
openssl = { version = "0.10.76", features = ["vendored"] }
pgp = "0.19.0"
rand = "0.8"
